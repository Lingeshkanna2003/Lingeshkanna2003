<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <title>Codeword — click to start a round</title>
  <desc>A six-row, five-letter puzzle board. Solve a software word from a clue in six guesses.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c15"/>
      <stop offset="1" stop-color="#0b120e"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="358" rx="22" fill="url(#panel)" stroke="#304637" stroke-width="2"/>
  <path d="M1 22a21 21 0 0 1 21-21h1237a21 21 0 0 1 21 21v4H1z" fill="#17271c" opacity=".72"/>
  <text x="58" y="74" fill="#a9cf83" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">A QUICK SOFTWARE PUZZLE</text>
  <text x="56" y="139" fill="#f0f4ed" font-family="Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5">Codeword</text>
  <text x="59" y="181" fill="#c4cec6" font-family="Arial, sans-serif" font-size="20">Solve a five-letter word from a clue.</text>
  <text x="59" y="214" fill="#87988d" font-family="Arial, sans-serif" font-size="16">Six guesses · letter-by-letter feedback</text>
  <rect x="58" y="255" width="205" height="48" rx="24" fill="#b7d891"/>
  <text x="84" y="286" fill="#132016" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1">CLICK TO PLAY  →</text>
  <g fill="#15231a" stroke="#658262" stroke-width="2">
    <rect x="370" y="28" width="48" height="44" rx="8"/><rect x="428" y="28" width="48" height="44" rx="8"/><rect x="486" y="28" width="48" height="44" rx="8"/><rect x="544" y="28" width="48" height="44" rx="8"/><rect x="602" y="28" width="48" height="44" rx="8"/>
    <rect x="370" y="82" width="48" height="44" rx="8"/><rect x="428" y="82" width="48" height="44" rx="8"/><rect x="486" y="82" width="48" height="44" rx="8"/><rect x="544" y="82" width="48" height="44" rx="8"/><rect x="602" y="82" width="48" height="44" rx="8"/>
    <rect x="370" y="136" width="48" height="44" rx="8"/><rect x="428" y="136" width="48" height="44" rx="8"/><rect x="486" y="136" width="48" height="44" rx="8"/><rect x="544" y="136" width="48" height="44" rx="8"/><rect x="602" y="136" width="48" height="44" rx="8"/>
    <rect x="370" y="190" width="48" height="44" rx="8"/><rect x="428" y="190" width="48" height="44" rx="8"/><rect x="486" y="190" width="48" height="44" rx="8"/><rect x="544" y="190" width="48" height="44" rx="8"/><rect x="602" y="190" width="48" height="44" rx="8"/>
    <rect x="370" y="244" width="48" height="44" rx="8"/><rect x="428" y="244" width="48" height="44" rx="8"/><rect x="486" y="244" width="48" height="44" rx="8"/><rect x="544" y="244" width="48" height="44" rx="8"/><rect x="602" y="244" width="48" height="44" rx="8"/>
    <rect x="370" y="298" width="48" height="44" rx="8"/><rect x="428" y="298" width="48" height="44" rx="8"/><rect x="486" y="298" width="48" height="44" rx="8"/><rect x="544" y="298" width="48" height="44" rx="8"/><rect x="602" y="298" width="48" height="44" rx="8"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="710" y="108" fill="#d8e0d8" font-size="17" font-weight="700">YOUR CLUE STARTS THE ROUND</text>
    <text x="710" y="146" fill="#8ca092" font-size="16">Guess a five-letter software word.</text>
    <g font-size="14">
      <rect x="710" y="178" width="16" height="16" rx="4" fill="#a9cf83"/><text x="739" y="191" fill="#c4cec6">Right letter, right place</text>
      <rect x="710" y="208" width="16" height="16" rx="4" fill="#d9aa6e"/><text x="739" y="221" fill="#c4cec6">Right letter, different place</text>
      <rect x="710" y="238" width="16" height="16" rx="4" fill="#435048"/><text x="739" y="251" fill="#c4cec6">Letter not in the word</text>
    </g>
    <text x="710" y="304" fill="#a9cf83" font-size="15" font-weight="700" letter-spacing="1">ONE GUESS PER COMMENT</text>
  </g>
</svg>
